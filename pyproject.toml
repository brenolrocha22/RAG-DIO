[project]
name = "rag-in-action"
version = "0.1.0"
description = "Aplicação RAG com Chainlit, LlamaIndex, ChromaDB e OpenRouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio==4.10.0",
    "chainlit>=2.11.0",
    "chromadb",
    "fastapi==0.135.2",
    "fastembed>=0.7",
    "llama-index-core",
    "llama-index-embeddings-fastembed",
    "llama-index-llms-openrouter>=0.5.1",
    "llama-index-vector-stores-chroma",
    "python-dotenv>=1.2.2",
    "starlette==0.50.0",
]